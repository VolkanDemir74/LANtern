<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>LANtern</title><link rel="icon" href="/assets/lantern-brand.png"><link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <section class="panel">
      <header>
        <div class="brand"><img src="/assets/lantern-brand.png" alt="LANtern"><p><span data-i18n="adminPanel">Yönetim paneli</span><a href="/" target="_blank" data-i18n="openViewer">İzleme sayfasını aç</a></p></div>
        <div class="header-tools"><div class="language" role="group" aria-label="Language"><button type="button" data-lang="tr">TR</button><span>•</span><button type="button" data-lang="en">EN</button></div><button id="openSettings" class="settings-trigger" data-i18n="settings">Ayarlar</button><span id="state" class="badge">Hazır</span></div>
      </header>
      <div class="grid">
        <label><span data-i18n="address">LANtern adresi</span><output id="url">—</output></label>
        <label><span data-i18n="display">Ekran</span><select id="display"></select></label>
      </div>
      <div class="monitor-actions"><button id="monitorStart" class="secondary" data-i18n="monitorStart">Sanal monitörü bağla</button><button id="monitorStop" class="secondary" data-i18n="monitorStop">Sanal monitör bağlantısını kes</button></div>
      <div class="actions"><button id="start" data-i18n="start">Yayını Başlat</button><button id="stop" class="secondary" data-i18n="stop">Yayını Durdur</button><button id="connect" class="secondary" data-i18n="connect">Bağlan</button><button id="fullscreen" class="secondary" data-i18n="fullscreen">Tam Ekran</button></div>
      <section class="qr"><img src="/api/qr" alt="Viewer QR code"><span data-i18n="qr">Telefon kamerasıyla okut: izleme sayfası</span></section>
      <p id="info" class="info"></p>
    </section>
    <section id="viewerShell" class="viewer"><iframe id="viewer" srcdoc="<!doctype html><style>html,body{width:100%;height:100%;margin:0;background:#030508}</style>" title="LANtern stream" allow="autoplay; fullscreen" allowfullscreen></iframe><div id="empty" data-i18n="viewerEmpty">Yayını görüntülemek için Bağlan'a basın</div></section>
  </main>
  <dialog id="settingsDialog">
    <form method="dialog" class="settings-panel">
      <div class="settings-title"><h2 data-i18n="settings">Ayarlar</h2><button value="cancel" class="close-button" aria-label="Close">×</button></div>
      <div class="settings-grid">
        <label><span data-i18n="resolution">Çözünürlük</span><select id="resolution"><option>1920x1080</option><option>1920x1200</option><option>1280x720</option></select></label>
        <label><span data-i18n="fps">Kare hızı</span><select id="fps"><option>60</option><option>30</option></select></label>
        <label class="wide"><span data-i18n="scaling">Görüntü yerleşimi</span><select id="scalingMode"><option value="fill" selected></option><option value="fit"></option></select></label>
        <label><span data-i18n="bitrate">Bit hızı</span><select id="bitrate"><option value="10000">10 Mbps</option><option value="15000" selected></option><option value="20000">20 Mbps</option><option value="25000">25 Mbps</option></select></label>
        <label><span data-i18n="encoder">Kodlayıcı</span><select id="encoder"><option value="auto"></option><option value="h264_nvenc">NVIDIA NVENC</option><option value="h264_qsv">Intel Quick Sync</option><option value="h264_amf">AMD AMF</option><option value="libx264"></option></select></label>
      </div>
      <div class="settings-checks">
        <label class="check"><input id="captureCursor" type="checkbox" checked><span data-i18n="cursor">Fare imlecini göster</span></label>
        <label class="check"><input id="startWithWindows" type="checkbox"><span data-i18n="startWithWindows">Windows ile LANtern'ı başlat</span></label>
        <label class="check"><input id="autoConnectMonitor" type="checkbox"><span data-i18n="autoConnectMonitor">Sanal monitörü otomatik bağla</span></label>
        <label class="check"><input id="autoStartOnMonitorConnect" type="checkbox" checked><span data-i18n="autoStartOnMonitorConnect">Sanal monitör bağlanınca yayını başlat</span></label>
        <label class="check"><input id="autoStartStream" type="checkbox"><span data-i18n="autoStartStream">LANtern açılınca yayını otomatik başlat</span></label>
        <label class="check"><input id="startInTray" type="checkbox"><span data-i18n="startInTray">Tray'de başlat</span></label>
      </div>
      <p class="settings-note" data-i18n="settingsNote">Otomatik yayın, ana panelde seçili olan ekranı ve bu yayın profilini kullanır.</p>
      <div class="settings-actions"><button value="cancel" class="secondary" data-i18n="cancel">İptal</button><button id="saveSettings" type="button" data-i18n="save">Kaydet</button></div>
    </form>
  </dialog>
  <script src="app.js?v=19"></script>
</body>
</html>
