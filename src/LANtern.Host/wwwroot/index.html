<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LANtern</title><link rel="icon" href="/assets/lantern-brand.png"><style>
:root{color-scheme:dark;font-family:system-ui;background:#000;color:#fff}*{box-sizing:border-box}body{margin:0;overflow:hidden}.watch{position:fixed;inset:0;display:grid;place-items:center;background:#000}.watch iframe{width:100%;height:100%;border:0;background:#000}.message{position:absolute;padding:20px;color:#64748b;text-align:center}.controls{position:absolute;z-index:10;right:max(7px,env(safe-area-inset-right));bottom:max(7px,env(safe-area-inset-bottom));display:flex;gap:5px;opacity:.3;transition:opacity .18s}.controls:hover,.controls:focus-within,.controls:active{opacity:.85}.icon-button{display:grid;place-items:center;width:30px;height:30px;padding:0;border:1px solid #94a3b866;border-radius:7px;background:#11182699;color:#fff;font:18px/1 system-ui;touch-action:manipulation}.icon-button:active{transform:scale(.92)}@media(max-width:600px){.controls{right:max(5px,env(safe-area-inset-right));bottom:max(5px,env(safe-area-inset-bottom));gap:4px}.icon-button{width:27px;height:27px;border-radius:6px;font-size:16px}}
</style></head><body><main id="watch" class="watch"><iframe id="viewer" src="/blank.html" title="LANtern stream" allow="autoplay; fullscreen" allowfullscreen></iframe><div class="message"><span id="messageText">Yayın bekleniyor…</span></div><div class="controls"><button id="reconnect" class="icon-button" aria-label="Yeniden bağlan" title="Yeniden bağlan">↻</button><button id="fullscreen" class="icon-button" aria-label="Tam ekran" title="Tam ekran">⛶</button></div></main><script src="viewer.js?v=4"></script></body></html>
